<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm payment · Wero Wallet (sandbox)</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Confirm payment</h1>
        <p class="muted">Single immediate payment</p>
      </div>
      <span class="badge">Sandbox · mock data</span>
    </header>

    <section id="request" class="total" hidden>
      <p class="muted">Pay to</p>
      <p id="shop" class="shop"></p>
      <p id="amount" class="amount"></p>
    </section>

    <form id="consent-form" hidden>
      <fieldset>
        <legend>Pay from</legend>
        <div id="accounts" class="accounts"></div>
      </fieldset>

      <div class="fingerprint">
        <button id="fingerprint" type="button" class="sensor" aria-describedby="sensor-hint">
          <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M12 11v3.5c0 2-.6 3.9-1.7 5.5"/>
            <path d="M8.5 9.5A3.5 3.5 0 0 1 15.5 11v2.5c0 2.6-.7 5-2 7"/>
            <path d="M5.5 8.5A7 7 0 0 1 19 11v2c0 1.6-.2 3.2-.6 4.7"/>
            <path d="M6.3 20c.8-1.7 1.2-3.6 1.2-5.5V11"/>
            <path d="M4 15.5c.3-1 .5-2 .5-3V11a7.5 7.5 0 0 1 1.1-3.9"/>
            <path d="M7.5 4.2A9.5 9.5 0 0 1 21 11v1"/>
          </svg>
          <span class="progress" aria-hidden="true"></span>
        </button>
        <p id="sensor-hint" class="muted">Touch and hold to confirm with your fingerprint</p>
      </div>

      <button id="cancel" type="button" class="secondary">Cancel payment</button>
    </form>

    <section id="result" class="result" hidden aria-live="polite">
      <p id="result-title" class="result-title"></p>
      <p id="result-detail" class="muted"></p>
      <a href="/" class="link-button">Back to wallet</a>
    </section>

    <p id="error" class="error" hidden role="alert"></p>
  </main>
  <script src="authenticate.js" type="module"></script>
</body>
</html>
